# Render Blueprint —— 配合仓库根目录的 「Deploy to Render」 按钮一键部署
# 部署地址形如：https://guofeng-prompt-workbench.onrender.com
services:
  - type: web
    name: guofeng-prompt-workbench
    runtime: node
    plan: free
    region: singapore          # 新加坡节点，国内访问延迟较低
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MAX_TOKENS
        value: "16000"
      - key: MOCK
        value: "0"
      - key: LLM_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: LLM_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b
      # ⚠️ 刻意【不设置】LLM_API_KEY：
      #    让每位使用者在网页配置面板里填自己的 Key，
      #    避免部署者的额度被他人消耗，也避免密钥泄漏。
      #    若你想给自己的实例预置 Key，在此新增一项即可（注意仓库是公开的）。
